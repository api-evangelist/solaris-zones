naftiko: 1.0.0-alpha2
info:
  label: Solaris Zones Solaris Zone Monitoring API — Zone Statistics
  description: 'Solaris Zones Solaris Zone Monitoring API — Zone Statistics. 1 operations. Lead operation: Solaris Zones Get
    Zone Resource Cap Statistics. Self-contained Naftiko capability covering one Solaris Zones business surface.'
  tags:
  - Solaris Zones
  - Zone Statistics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SOLARIS_ZONES_API_KEY: SOLARIS_ZONES_API_KEY
capability:
  consumes:
  - type: http
    namespace: solaris-zone-monitoring-zone-statistics
    baseUri: https://{host}:{port}/api
    description: Solaris Zones Solaris Zone Monitoring API — Zone Statistics business capability. Self-contained, no shared
      references.
    resources:
    - name: com.oracle.solaris.rad.kstat-2.0-Kstat-zones,{zoneName},zone_caps,{zoneId}
      path: /com.oracle.solaris.rad.kstat/2.0/Kstat/zones,{zoneName},zone_caps,{zoneId}
      operations:
      - name: getzonecapstats
        method: GET
        description: Solaris Zones Get Zone Resource Cap Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          description: Name of the zone
          required: true
        - name: zoneId
          in: path
          type: integer
          description: Numeric zone ID
          required: true
    authentication:
      type: apikey
      key: _rad_session
      value: '{{env.SOLARIS_ZONES_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: solaris-zone-monitoring-zone-statistics-rest
    port: 8080
    description: REST adapter for Solaris Zones Solaris Zone Monitoring API — Zone Statistics. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/com-oracle-solaris-rad-kstat/2-0/kstat/zones-zonename-zone-caps-zoneid
      name: com-oracle-solaris-rad-kstat-2-0-kstat-zones-zonename-zone-caps-zoneid
      description: REST surface for com.oracle.solaris.rad.kstat-2.0-Kstat-zones,{zoneName},zone_caps,{zoneId}.
      operations:
      - method: GET
        name: getzonecapstats
        description: Solaris Zones Get Zone Resource Cap Statistics
        call: solaris-zone-monitoring-zone-statistics.getzonecapstats
        with:
          zoneName: rest.zoneName
          zoneId: rest.zoneId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: solaris-zone-monitoring-zone-statistics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Solaris Zones Solaris Zone Monitoring API — Zone Statistics. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: solaris-zones-get-zone-resource
      description: Solaris Zones Get Zone Resource Cap Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-monitoring-zone-statistics.getzonecapstats
      with:
        zoneName: tools.zoneName
        zoneId: tools.zoneId
      outputParameters:
      - type: object
        mapping: $.
