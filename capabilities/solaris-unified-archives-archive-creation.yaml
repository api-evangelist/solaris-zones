naftiko: 1.0.0-alpha2
info:
  label: Solaris Zones Oracle Solaris Unified Archives Zones API — Archive Creation
  description: 'Solaris Zones Oracle Solaris Unified Archives Zones API — Archive Creation. 2 operations. Lead operation:
    Solaris Zones Detach Zone for Archival. Self-contained Naftiko capability covering one Solaris Zones business surface.'
  tags:
  - Solaris Zones
  - Archive Creation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SOLARIS_ZONES_API_KEY: SOLARIS_ZONES_API_KEY
capability:
  consumes:
  - type: http
    namespace: solaris-unified-archives-archive-creation
    baseUri: https://{host}:{port}/api/com.oracle.solaris.rad.zonemgr/1.6
    description: Solaris Zones Oracle Solaris Unified Archives Zones API — Archive Creation business capability. Self-contained,
      no shared references.
    resources:
    - name: Zone-zoneName-_rad_method-detach
      path: /Zone/{zoneName}/_rad_method/detach
      operations:
      - name: detachzoneforarchive
        method: PUT
        description: Solaris Zones Detach Zone for Archival
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: Zone-zoneName-_rad_method-exportConfig
      path: /Zone/{zoneName}/_rad_method/exportConfig
      operations:
      - name: exportzoneconfigforarchive
        method: PUT
        description: Solaris Zones Export Zone Configuration for Archival
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: _rad_session
      value: '{{env.SOLARIS_ZONES_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: solaris-unified-archives-archive-creation-rest
    port: 8080
    description: REST adapter for Solaris Zones Oracle Solaris Unified Archives Zones API — Archive Creation. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/zone/{zonename}/rad-method/detach
      name: zone-zonename-rad-method-detach
      description: REST surface for Zone-zoneName-_rad_method-detach.
      operations:
      - method: PUT
        name: detachzoneforarchive
        description: Solaris Zones Detach Zone for Archival
        call: solaris-unified-archives-archive-creation.detachzoneforarchive
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zone/{zonename}/rad-method/exportconfig
      name: zone-zonename-rad-method-exportconfig
      description: REST surface for Zone-zoneName-_rad_method-exportConfig.
      operations:
      - method: PUT
        name: exportzoneconfigforarchive
        description: Solaris Zones Export Zone Configuration for Archival
        call: solaris-unified-archives-archive-creation.exportzoneconfigforarchive
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: solaris-unified-archives-archive-creation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Solaris Zones Oracle Solaris Unified Archives Zones API — Archive Creation. One tool per
      consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: solaris-zones-detach-zone-archival
      description: Solaris Zones Detach Zone for Archival
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: solaris-unified-archives-archive-creation.detachzoneforarchive
      outputParameters:
      - type: object
        mapping: $.
    - name: solaris-zones-export-zone-configuration
      description: Solaris Zones Export Zone Configuration for Archival
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: solaris-unified-archives-archive-creation.exportzoneconfigforarchive
      outputParameters:
      - type: object
        mapping: $.
