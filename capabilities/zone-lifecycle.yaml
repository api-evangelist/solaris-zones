naftiko: 1.0.0-alpha2
info:
  label: Solaris Zone Lifecycle Management
  description: Unified zone lifecycle workflow combining zone creation, configuration, administration, monitoring, and migration.
    Used by system administrators and platform engineers to manage Solaris virtualization infrastructure.
  tags:
  - Solaris
  - Zones
  - Virtualization
  - Lifecycle Management
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SOLARIS_AUTH_TOKEN: SOLARIS_AUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: zones-mgmt
    baseUri: https://solaris-host.example.com/api/v1
    description: Solaris Zones Management API for zone lifecycle operations.
    authentication:
      type: bearer
      token: '{{SOLARIS_AUTH_TOKEN}}'
    resources:
    - name: zones
      path: /zones
      description: Zone lifecycle management.
      operations:
      - name: list-zone-interfaces
        method: GET
        description: List available zone management interfaces.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-zone-manager
        method: GET
        description: Get zone manager details.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-zone
        method: POST
        description: Create a new zone.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-zone
        method: DELETE
        description: Delete a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-zone
        method: GET
        description: Get zone details.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-zone-state
        method: GET
        description: Get the current state of a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: boot-zone
        method: POST
        description: Boot a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: halt-zone
        method: POST
        description: Halt a zone immediately.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: shutdown-zone
        method: POST
        description: Gracefully shutdown a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: reboot-zone
        method: POST
        description: Reboot a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: install-zone
        method: POST
        description: Install a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: uninstall-zone
        method: POST
        description: Uninstall a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: clone-zone
        method: POST
        description: Clone a zone.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: migrate-zone
        method: POST
        description: Migrate a zone to another host.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: verify-zone
        method: GET
        description: Verify zone configuration.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
          description: Zone name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-zone-info
        method: GET
        description: List information for all zones.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: solaris-lifecycle-api
    description: Unified REST API for Solaris zone lifecycle management.
    resources:
    - path: /v1/zones
      name: zones
      description: Zone inventory and creation.
      operations:
      - method: GET
        name: list-zones
        description: List all zones.
        call: zones-mgmt.list-zone-info
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-zone
        description: Create a new zone.
        call: zones-mgmt.create-zone
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zones/{zoneName}
      name: zone-detail
      description: Individual zone operations.
      operations:
      - method: GET
        name: get-zone
        description: Get zone details.
        call: zones-mgmt.get-zone
        with:
          zoneName: rest.zoneName
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-zone
        description: Delete a zone.
        call: zones-mgmt.delete-zone
        with:
          zoneName: rest.zoneName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zones/{zoneName}/state
      name: zone-state
      description: Zone state operations.
      operations:
      - method: GET
        name: get-zone-state
        description: Get current zone state.
        call: zones-mgmt.get-zone-state
        with:
          zoneName: rest.zoneName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zones/{zoneName}/boot
      name: zone-boot
      description: Boot a zone.
      operations:
      - method: POST
        name: boot-zone
        description: Boot the zone.
        call: zones-mgmt.boot-zone
        with:
          zoneName: rest.zoneName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zones/{zoneName}/shutdown
      name: zone-shutdown
      description: Shutdown a zone.
      operations:
      - method: POST
        name: shutdown-zone
        description: Gracefully shutdown.
        call: zones-mgmt.shutdown-zone
        with:
          zoneName: rest.zoneName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zones/{zoneName}/reboot
      name: zone-reboot
      description: Reboot a zone.
      operations:
      - method: POST
        name: reboot-zone
        description: Reboot the zone.
        call: zones-mgmt.reboot-zone
        with:
          zoneName: rest.zoneName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zones/{zoneName}/migrate
      name: zone-migrate
      description: Migrate a zone.
      operations:
      - method: POST
        name: migrate-zone
        description: Migrate to another host.
        call: zones-mgmt.migrate-zone
        with:
          zoneName: rest.zoneName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: solaris-lifecycle-mcp
    transport: http
    description: MCP server for AI-assisted Solaris zone lifecycle management.
    tools:
    - name: list-zones
      description: List all Solaris zones with status.
      hints:
        readOnly: true
        idempotent: true
      call: zones-mgmt.list-zone-info
      outputParameters:
      - type: object
        mapping: $.
    - name: create-zone
      description: Create a new Solaris zone.
      hints:
        readOnly: false
      call: zones-mgmt.create-zone
      outputParameters:
      - type: object
        mapping: $.
    - name: get-zone
      description: Get Solaris zone details.
      hints:
        readOnly: true
        idempotent: true
      call: zones-mgmt.get-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-zone-state
      description: Get current zone state.
      hints:
        readOnly: true
        idempotent: true
      call: zones-mgmt.get-zone-state
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: boot-zone
      description: Boot a Solaris zone.
      hints:
        readOnly: false
      call: zones-mgmt.boot-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: halt-zone
      description: Halt a zone immediately.
      hints:
        readOnly: false
        destructive: true
      call: zones-mgmt.halt-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: shutdown-zone
      description: Gracefully shutdown a zone.
      hints:
        readOnly: false
      call: zones-mgmt.shutdown-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: reboot-zone
      description: Reboot a Solaris zone.
      hints:
        readOnly: false
      call: zones-mgmt.reboot-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: install-zone
      description: Install a Solaris zone.
      hints:
        readOnly: false
      call: zones-mgmt.install-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: uninstall-zone
      description: Uninstall a Solaris zone.
      hints:
        readOnly: false
        destructive: true
      call: zones-mgmt.uninstall-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: clone-zone
      description: Clone a Solaris zone.
      hints:
        readOnly: false
      call: zones-mgmt.clone-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: migrate-zone
      description: Migrate a zone to another host.
      hints:
        readOnly: false
      call: zones-mgmt.migrate-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: verify-zone
      description: Verify zone configuration integrity.
      hints:
        readOnly: true
        idempotent: true
      call: zones-mgmt.verify-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-zone
      description: Delete a Solaris zone.
      hints:
        readOnly: false
        destructive: true
      call: zones-mgmt.delete-zone
      with:
        zoneName: tools.zoneName
      outputParameters:
      - type: object
        mapping: $.
