naftiko: 1.0.0-alpha2
info:
  label: Solaris Zones Monitoring Statistics API — Memory Statistics
  description: 'Solaris Zones Monitoring Statistics API — Memory Statistics. 3 operations. Lead operation: Solaris Zones Get
    Zone Physical Memory Cap Statistics. Self-contained Naftiko capability covering one Solaris Zones business surface.'
  tags:
  - Solaris Zones
  - Memory Statistics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SOLARIS_ZONES_API_KEY: SOLARIS_ZONES_API_KEY
capability:
  consumes:
  - type: http
    namespace: solaris-zone-stats-memory-statistics
    baseUri: https://{host}:{port}/api
    description: Solaris Zones Monitoring Statistics API — Memory Statistics business capability. Self-contained, no shared
      references.
    resources:
    - name: com.oracle.solaris.rad.kstat-2.0-Kstat-memory_cap,{zoneId},physcap,{zoneId}
      path: /com.oracle.solaris.rad.kstat/2.0/Kstat/memory_cap,{zoneId},physcap,{zoneId}
      operations:
      - name: getzonephysicalmemorycap
        method: GET
        description: Solaris Zones Get Zone Physical Memory Cap Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: zoneId
          in: path
          type: integer
          description: Numeric zone ID
          required: true
    - name: com.oracle.solaris.rad.kstat-2.0-Kstat-memory_cap,{zoneId},swapcap,{zoneId}
      path: /com.oracle.solaris.rad.kstat/2.0/Kstat/memory_cap,{zoneId},swapcap,{zoneId}
      operations:
      - name: getzoneswapcap
        method: GET
        description: Solaris Zones Get Zone Swap Cap Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: zoneId
          in: path
          type: integer
          required: true
    - name: com.oracle.solaris.rad.kstat-2.0-Kstat-unix,0,system_pages,0
      path: /com.oracle.solaris.rad.kstat/2.0/Kstat/unix,0,system_pages,0
      operations:
      - name: getsystemmemorypages
        method: GET
        description: Solaris Zones Get System Memory Page Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: _rad_session
      value: '{{env.SOLARIS_ZONES_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: solaris-zone-stats-memory-statistics-rest
    port: 8080
    description: REST adapter for Solaris Zones Monitoring Statistics API — Memory Statistics. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/com-oracle-solaris-rad-kstat/2-0/kstat/memory-cap-zoneid-physcap-zoneid
      name: com-oracle-solaris-rad-kstat-2-0-kstat-memory-cap-zoneid-physcap-zoneid
      description: REST surface for com.oracle.solaris.rad.kstat-2.0-Kstat-memory_cap,{zoneId},physcap,{zoneId}.
      operations:
      - method: GET
        name: getzonephysicalmemorycap
        description: Solaris Zones Get Zone Physical Memory Cap Statistics
        call: solaris-zone-stats-memory-statistics.getzonephysicalmemorycap
        with:
          zoneId: rest.zoneId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/com-oracle-solaris-rad-kstat/2-0/kstat/memory-cap-zoneid-swapcap-zoneid
      name: com-oracle-solaris-rad-kstat-2-0-kstat-memory-cap-zoneid-swapcap-zoneid
      description: REST surface for com.oracle.solaris.rad.kstat-2.0-Kstat-memory_cap,{zoneId},swapcap,{zoneId}.
      operations:
      - method: GET
        name: getzoneswapcap
        description: Solaris Zones Get Zone Swap Cap Statistics
        call: solaris-zone-stats-memory-statistics.getzoneswapcap
        with:
          zoneId: rest.zoneId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/com-oracle-solaris-rad-kstat/2-0/kstat/unix-0-system-pages-0
      name: com-oracle-solaris-rad-kstat-2-0-kstat-unix-0-system-pages-0
      description: REST surface for com.oracle.solaris.rad.kstat-2.0-Kstat-unix,0,system_pages,0.
      operations:
      - method: GET
        name: getsystemmemorypages
        description: Solaris Zones Get System Memory Page Statistics
        call: solaris-zone-stats-memory-statistics.getsystemmemorypages
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: solaris-zone-stats-memory-statistics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Solaris Zones Monitoring Statistics API — Memory Statistics. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: solaris-zones-get-zone-physical
      description: Solaris Zones Get Zone Physical Memory Cap Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-stats-memory-statistics.getzonephysicalmemorycap
      with:
        zoneId: tools.zoneId
      outputParameters:
      - type: object
        mapping: $.
    - name: solaris-zones-get-zone-swap
      description: Solaris Zones Get Zone Swap Cap Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-stats-memory-statistics.getzoneswapcap
      with:
        zoneId: tools.zoneId
      outputParameters:
      - type: object
        mapping: $.
    - name: solaris-zones-get-system-memory
      description: Solaris Zones Get System Memory Page Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-stats-memory-statistics.getsystemmemorypages
      outputParameters:
      - type: object
        mapping: $.
