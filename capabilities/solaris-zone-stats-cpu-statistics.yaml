naftiko: 1.0.0-alpha2
info:
  label: Solaris Zones Monitoring Statistics API — CPU Statistics
  description: 'Solaris Zones Monitoring Statistics API — CPU Statistics. 2 operations. Lead operation: Solaris Zones Get
    Zone Cpu Cap Statistics. Self-contained Naftiko capability covering one Solaris Zones business surface.'
  tags:
  - Solaris Zones
  - CPU Statistics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SOLARIS_ZONES_API_KEY: SOLARIS_ZONES_API_KEY
capability:
  consumes:
  - type: http
    namespace: solaris-zone-stats-cpu-statistics
    baseUri: https://{host}:{port}/api
    description: Solaris Zones Monitoring Statistics API — CPU Statistics business capability. Self-contained, no shared references.
    resources:
    - name: com.oracle.solaris.rad.kstat-2.0-Kstat-cpucaps,{zoneName},cpucaps_zone_{zoneId},
      path: /com.oracle.solaris.rad.kstat/2.0/Kstat/cpucaps,{zoneName},cpucaps_zone_{zoneId},{zoneId}
      operations:
      - name: getzonecpucap
        method: GET
        description: Solaris Zones Get Zone Cpu Cap Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: zoneName
          in: path
          type: string
          required: true
        - name: zoneId
          in: path
          type: integer
          required: true
    - name: com.oracle.solaris.rad.kstat-2.0-Kstat-misc,cpu_info0,cpu_info,{cpuId}
      path: /com.oracle.solaris.rad.kstat/2.0/Kstat/misc,cpu_info0,cpu_info,{cpuId}
      operations:
      - name: getcpuinfo
        method: GET
        description: Solaris Zones Get Cpu Information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cpuId
          in: path
          type: integer
          description: CPU identifier number
          required: true
    authentication:
      type: apikey
      key: _rad_session
      value: '{{env.SOLARIS_ZONES_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: solaris-zone-stats-cpu-statistics-rest
    port: 8080
    description: REST adapter for Solaris Zones Monitoring Statistics API — CPU Statistics. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/com-oracle-solaris-rad-kstat/2-0/kstat/cpucaps-zonename-cpucaps-zone-zoneid-zoneid
      name: com-oracle-solaris-rad-kstat-2-0-kstat-cpucaps-zonename-cpucaps-zone-zoneid
      description: REST surface for com.oracle.solaris.rad.kstat-2.0-Kstat-cpucaps,{zoneName},cpucaps_zone_{zoneId},.
      operations:
      - method: GET
        name: getzonecpucap
        description: Solaris Zones Get Zone Cpu Cap Statistics
        call: solaris-zone-stats-cpu-statistics.getzonecpucap
        with:
          zoneName: rest.zoneName
          zoneId: rest.zoneId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/com-oracle-solaris-rad-kstat/2-0/kstat/misc-cpu-info0-cpu-info-cpuid
      name: com-oracle-solaris-rad-kstat-2-0-kstat-misc-cpu-info0-cpu-info-cpuid
      description: REST surface for com.oracle.solaris.rad.kstat-2.0-Kstat-misc,cpu_info0,cpu_info,{cpuId}.
      operations:
      - method: GET
        name: getcpuinfo
        description: Solaris Zones Get Cpu Information
        call: solaris-zone-stats-cpu-statistics.getcpuinfo
        with:
          cpuId: rest.cpuId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: solaris-zone-stats-cpu-statistics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Solaris Zones Monitoring Statistics API — CPU Statistics. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: solaris-zones-get-zone-cpu
      description: Solaris Zones Get Zone Cpu Cap Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-stats-cpu-statistics.getzonecpucap
      with:
        zoneName: tools.zoneName
        zoneId: tools.zoneId
      outputParameters:
      - type: object
        mapping: $.
    - name: solaris-zones-get-cpu-information
      description: Solaris Zones Get Cpu Information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-stats-cpu-statistics.getcpuinfo
      with:
        cpuId: tools.cpuId
      outputParameters:
      - type: object
        mapping: $.
