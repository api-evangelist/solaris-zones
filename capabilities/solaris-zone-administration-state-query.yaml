naftiko: 1.0.0-alpha2
info:
  label: Solaris Zones Solaris Zone Administration API — State Query
  description: 'Solaris Zones Solaris Zone Administration API — State Query. 3 operations. Lead operation: Solaris Zones Verify
    Zone Configuration. Self-contained Naftiko capability covering one Solaris Zones business surface.'
  tags:
  - Solaris Zones
  - State Query
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SOLARIS_ZONES_API_KEY: SOLARIS_ZONES_API_KEY
capability:
  consumes:
  - type: http
    namespace: solaris-zone-administration-state-query
    baseUri: https://{host}:{port}/api/com.oracle.solaris.rad.zonemgr/1.6
    description: Solaris Zones Solaris Zone Administration API — State Query business capability. Self-contained, no shared
      references.
    resources:
    - name: Zone-zoneName-_rad_method-verify
      path: /Zone/{zoneName}/_rad_method/verify
      operations:
      - name: verifyzone
        method: PUT
        description: Solaris Zones Verify Zone Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: Zone-zoneName-auxstate
      path: /Zone/{zoneName}/auxstate
      operations:
      - name: getzoneauxstate
        method: GET
        description: Solaris Zones Get Zone Auxiliary States
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: Zone-zoneName-state
      path: /Zone/{zoneName}/state
      operations:
      - name: getzonestate
        method: GET
        description: Solaris Zones Get Current Zone State
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: _rad_session
      value: '{{env.SOLARIS_ZONES_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: solaris-zone-administration-state-query-rest
    port: 8080
    description: REST adapter for Solaris Zones Solaris Zone Administration API — State Query. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/zone/{zonename}/rad-method/verify
      name: zone-zonename-rad-method-verify
      description: REST surface for Zone-zoneName-_rad_method-verify.
      operations:
      - method: PUT
        name: verifyzone
        description: Solaris Zones Verify Zone Configuration
        call: solaris-zone-administration-state-query.verifyzone
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zone/{zonename}/auxstate
      name: zone-zonename-auxstate
      description: REST surface for Zone-zoneName-auxstate.
      operations:
      - method: GET
        name: getzoneauxstate
        description: Solaris Zones Get Zone Auxiliary States
        call: solaris-zone-administration-state-query.getzoneauxstate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/zone/{zonename}/state
      name: zone-zonename-state
      description: REST surface for Zone-zoneName-state.
      operations:
      - method: GET
        name: getzonestate
        description: Solaris Zones Get Current Zone State
        call: solaris-zone-administration-state-query.getzonestate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: solaris-zone-administration-state-query-mcp
    port: 9090
    transport: http
    description: MCP adapter for Solaris Zones Solaris Zone Administration API — State Query. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: solaris-zones-verify-zone-configuration
      description: Solaris Zones Verify Zone Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: solaris-zone-administration-state-query.verifyzone
      outputParameters:
      - type: object
        mapping: $.
    - name: solaris-zones-get-zone-auxiliary
      description: Solaris Zones Get Zone Auxiliary States
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-administration-state-query.getzoneauxstate
      outputParameters:
      - type: object
        mapping: $.
    - name: solaris-zones-get-current-zone
      description: Solaris Zones Get Current Zone State
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: solaris-zone-administration-state-query.getzonestate
      outputParameters:
      - type: object
        mapping: $.
