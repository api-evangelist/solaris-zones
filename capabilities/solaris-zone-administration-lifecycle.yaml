    resources:
    - name: Zone-zoneName-_rad_method-boot
      path: /Zone/{zoneName}/_rad_method/boot
      operations:
      - name: bootzone
        method: PUT
        description: Solaris Zones Boot a Zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
