      path: /com.oracle.solaris.rad.zonemgr/1.6
      operations:
      - name: listallzones
        method: GET
        description: Solaris Zones List All Zones With Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
