description: Solaris Zones is a built-in OS feature of Oracle Solaris (administered via zoneadm/zonecfg
  and the RAD Zone Management REST API). It is not a hosted, separately metered API product; it has no
  per-call price, public sandbox tier, or developer plan. Cost is incurred at the Oracle Solaris OS subscription
  level (Oracle Premier Support for Operating Systems / SPARC hardware) and at the Oracle Solaris Cloud
  / OCI deployment level.
sources:
  - https://docs.oracle.com/cd/E37838_01/html/E61038/index.html
  - https://www.oracle.com/solaris/
notes: Solaris Zones APIs (RAD, libzonestat, StatsStore) are local-host or per-host endpoints inside an
  Oracle Solaris install and have no per-call billing. The "plan" here represents the parent Oracle Solaris
  OS subscription that includes Zones; specific subscription SKU pricing is published only via Oracle
  Sales / Oracle Store and is not reproducible. reconciled is false because we did not retrieve a live
  Oracle Solaris price page.
plans:
  - id: solaris-zones-included-with-oracle-solaris
    name: Included with Oracle Solaris Subscription
    type: enterprise
    description: Solaris Zones is shipped as a feature of Oracle Solaris (10 / 11) and is licensed under
      the Oracle Solaris Premier Support / OS subscription that the customer holds for their SPARC or
      x86 systems. There is no separate Zones SKU, no per-zone fee, and no per-API-call charge for the
      RAD Zone Management REST API or libzonestat.
    entries:
      - label: Oracle Solaris OS Subscription
        name: oracle_solaris_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Solaris Zones (zoneadm / zonecfg)
      - name: Oracle Solaris Kernel Zones
      - name: RAD Zone Management REST API
      - name: libzonestat / Zones Monitoring Statistics
      - name: Oracle Solaris StatsStore
      - name: Oracle Solaris Unified Archives
