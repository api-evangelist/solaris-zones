components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: _rad_session
      description: >-
        RAD session cookie obtained via authentication. Establish a session
        by posting credentials to the RAD authentication endpoint.
  parameters:
    zoneName:
      name: zoneName
      in: path
      required: true
      description: Name of the zone
      schema:
        type: string
    radDetail:
      name: _rad_detail
      in: query
      required: false
      description: >-
        When present, returns detailed information including all properties
        for each interface.
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: Authentication required or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RadError'
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RadError'
    NotFound:
      description: Zone or resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RadError'
  schemas:
    RadInterface:
      type: object
      properties:
        href:
          type: string
          description: URL path to the interface
          example: example_value
        type:
          type: string
          description: Interface type name
          example: example_value
    RadResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - failure
          example: success
        payload:
          type: object
          description: Result payload
          example: example_value
    RadError:
      type: object
      properties:
        status:
          type: string
          example: failure
        payload:
          type: object
          properties:
            code:
              type: integer
              description: Error code
            message:
              type: string
              description: Error message
          example: example_value
    ZoneManager:
      type: object
      properties:
        evacuationState:
          $ref: '#/components/schemas/EvacuationResult'
          description: Current evacuation state if any
    Zone:
      type: object
      properties:
        name:
          type: string
          description: Zone name
          example: Example Title
        brand:
          type: string
          description: Zone brand type (e.g., solaris, solaris-kz, solaris10)
          example: example_value
        id:
          type: integer
          description: Numeric zone ID (only when running or ready)
          example: abc123
        uuid:
          type: string
          format: uuid
          description: Zone UUID
          example: '500123'
        state:
          type: string
          enum:
          - configured
          - incomplete
          - installed
          - ready
          - running
          - shutting_down
          - down
          description: Current zone state
          example: configured
        auxstate:
          type: array
          items:
            type: string
          description: Auxiliary zone states
          example: []
    ZoneInfo:
      type: object
      properties:
        name:
          type: string
          description: Zone name
          example: Example Title
        brand:
          type: string
          description: Zone brand type
          example: example_value
        id:
          type: integer
          description: Numeric zone ID
          example: abc123
        uuid:
          type: string
          format: uuid
          description: Zone UUID
          example: '500123'
        isGlobal:
          type: boolean
          description: Whether this is a global zone
          example: true
    ZoneResult:
      type: object
      properties:
        status:
          type: string
          example: example_value
        payload:
          type: object
          properties:
            code:
              type: string
              enum:
              - NONE
              - FRAMEWORK_ERROR
              - SNAPSHOT_ERROR
              - COMMAND_ERROR
              - RESOURCE_ALREADY_EXISTS
              - RESOURCE_NOT_FOUND
              - RESOURCE_TOO_MANY
              - RESOURCE_UNKNOWN
              - ALREADY_EDITING
              - INCOMPLETE_NO_CONFIG
              - PROPERTY_UNKNOWN
              - NOT_EDITING
              - SYSTEM_ERROR
              - INVALID_ARGUMENT
              - INVALID_ZONE_STATE
              description: Error code
            message:
              type: string
              description: Error or success message
            stdout:
              type: string
              description: Standard output from the operation
            stderr:
              type: string
              description: Standard error from the operation
          example: example_value
    CreateZoneRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the new zone
          example: Example Title
        path:
          type: string
          description: Zone root path
          example: example_value
        template:
          type: string
          description: Zone brand template (e.g., SYSdefault)
          default: SYSdefault
          example: example_value
    MigrateZoneRequest:
      type: object
      required:
      - host
      - type
      properties:
        host:
          type: string
          description: Remote host to migrate the zone to
          example: example_value
        type:
          type: string
          enum:
          - live
          - cold
          description: Migration type
          example: live
        cipher:
          type: string
          description: Encryption cipher for the migration transfer
          example: example_value
    EvacuationResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAIL
          - PARTIAL_FAIL
          description: Overall evacuation status
          example: SUCCESS
        returning:
          type: boolean
          description: Whether this is a return evacuation
          example: true
        migrationResults:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EvacuationMigrationResult'
          description: Per-zone migration results keyed by zone name
          example: example_value
    EvacuationMigrationResult:
      type: object
      properties:
        zoneName:
          type: string
          description: Name of the zone
          example: example_value
        evacuated:
          type: boolean
          description: Whether the zone was successfully evacuated
          example: true
        evacuationTarget:
          type: string
          description: Destination host
          example: example_value
        migrationStatus:
          type: string
          description: Migration status
          example: example_value
        migrationError:
          $ref: '#/components/schemas/MigrationError'
    MigrationError:
      type: object
      properties:
        operation:
          type: string
          enum:
          - FRAMEWORK
          - CONNECT
          - INIT_CRYPTO
          - CONFIG_CHECK
          - CONFIGURE
          - ATTACH
          - BOOT
          - MIGRATE_INITIAL
          - MIGRATE
          - SUSPEND
          - RESTART
          - HALT
          - DETACH
          - UNCONFIGURE
          - COMPLETE
          - CANCEL
          description: The operation that failed
          example: FRAMEWORK
        error:
          type: string
          description: System or zone configuration error
          example: example_value
        message:
          type: string
          description: Human-readable error message
          example: example_value
