  /Zone/{zoneName}/getResources:
    put:
      operationId: getZoneResources
      summary: Solaris Zones Get Zone Resources
      description: Retrieve resources configured for the zone that match the specified filter criteria. Resources include anet, capped-cpu, capped-memory, fs, device, and other zone resource types.
