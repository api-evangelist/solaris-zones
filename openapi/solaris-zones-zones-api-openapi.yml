        delay: 0
        dispatcher: FALLBACK
  /Zone/{zoneName}/commitConfig:
    put:
      operationId: commitZoneConfig
      summary: Solaris Zones Commit Zone Configuration Changes
      description: Save all pending configuration changes made during the current editing session. The changes are written to persistent storage.
      tags:
      - Zones
      parameters:
      - $ref: '#/components/parameters/zoneName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
