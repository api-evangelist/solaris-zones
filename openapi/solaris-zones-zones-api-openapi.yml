  /Zone/{zoneName}/apply:
    put:
      operationId: applyZoneConfig
      summary: Solaris Zones Apply Configuration to Running Zone
      description: Apply committed configuration changes to a running zone without requiring a reboot. Not all configuration changes support live application.
      tags:
      - Zones
      parameters:
      - $ref: '#/components/parameters/zoneName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
            examples:
              ApplyzoneconfigRequestExample:
                summary: Default applyZoneConfig request
                x-microcks-default: true
                value:
                  payload: example_value
