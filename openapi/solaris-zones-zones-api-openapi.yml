      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /Zone/{zoneName}/ready:
    put:
      operationId: readyZone
      summary: Solaris Zones Ready a Zone
      description: Transition the zone to the ready state, which sets up the virtual platform for the zone but does not start any processes within it.
      tags:
      - Zones
      parameters:
      - $ref: '#/components/parameters/zoneName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
            examples:
              ReadyzoneRequestExample:
                summary: Default readyZone request
                x-microcks-default: true
                value:
                  payload: example_value
      responses:
        '200':
          description: Zone readied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
              examples:
                Readyzone200Example:
                  summary: Default readyZone 200 response
                  x-microcks-default: true
                  value:
                    status: success
                    payload:
                      code: ZEC_NONE
                      message: example_value
                      stdout: example_value
                      stderr: example_value
