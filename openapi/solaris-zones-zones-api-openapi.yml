        delay: 0
        dispatcher: FALLBACK
  /Zone/{zoneName}/suspend:
    put:
      operationId: suspendZone
      summary: Solaris Zones Suspend a Zone
      description: Suspend the specified running zone, saving its state to disk. The zone can later be resumed to continue execution from the point of suspension.
      tags:
      - Zones
      parameters:
      - $ref: '#/components/parameters/zoneName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
            examples:
