method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Solaris
  - Zones
  - Virtualization
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps placeholder for Solaris Zones. Zones is an OS feature of Oracle Solaris,
  not a metered API product; cost flows through the Oracle Solaris OS subscription and underlying SPARC/x86
  hardware support contracts.'
sources:
  - https://www.oracle.com/solaris/
  - https://docs.oracle.com/cd/E37838_01/html/E61038/index.html
notes: Solaris Zones is not separately invoiced; Oracle does not publish a per-Zone or per-API-call price.
  Meters here describe the consumption shape customers should observe locally (zone count, libzonestat
  CPU/memory, network traffic) so they can model the share of Solaris support cost a workload represents.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Oracle Corporation
serviceCategory: Operating System Virtualization
billingModel:
  pricingCategory: Bundled with Operating System Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Oracle Solaris Zones
  ServiceCategory: Operating System Virtualization
  ProviderName: Oracle
  PublisherName: Oracle Corporation
  InvoiceIssuerName: Oracle America, Inc.
  BillingCurrency: USD
meters:
  - name: active_zones
    unit: zone
    aggregation: max
    dimensions:
      - host
      - zone_brand
  - name: zone_cpu_seconds
    unit: second
    aggregation: sum
    dimensions:
      - host
      - zone
  - name: zone_memory_gb
    unit: GB-month
    aggregation: avg
    dimensions:
      - host
      - zone
principles:
  - name: Visibility
    description: Use libzonestat, the Solaris StatsStore Analytics REST API, and zonestat(1) to surface
      per-zone CPU, memory, and IO utilization on each Solaris host.
  - name: Allocation
    description: Tag each zone (via zonecfg attributes or naming convention) to the consuming application
      / cost center; aggregate libzonestat output to produce showback per business unit.
  - name: Optimization
    description: Consolidate underutilized zones, prefer non-global zones over kernel zones where isolation
      requirements allow, and use Unified Archives to migrate workloads onto better-utilized hosts.
  - name: Accountability
    description: Solaris platform owner reviews zone density vs. Oracle Solaris support contract to ensure
      hosts are sized to license obligations and to avoid stranded support cost.
