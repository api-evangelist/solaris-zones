specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Solaris Zones
providerId: solaris-zones
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Solaris
  - Zones
  - Operating Systems
  - Rate Limiting
description: Solaris Zones APIs are local administrative interfaces (RAD over HTTPS to the local host,
  zoneadm/zonecfg, libzonestat). They do not have a public, network-facing rate-limit policy; throughput
  is bounded by the Solaris host's CPU, memory, and the SMF service backing the RAD module rather than
  by a published per-second cap.
sources:
  - https://docs.oracle.com/cd/E37838_01/html/E61038/index.html
notes: Oracle does not publish per-second / per-minute API rate limits for the RAD Zone Management REST
  API, libzonestat, or Solaris StatsStore. Effective throughput is host-bound. reconciled is false because
  no public Oracle limits page was retrieved.
responseCodes: {}
limits:
  - name: Host-bound administrative API
    scope: host
    metric: varies
    limit: 'bound by host CPU/memory and SMF service capacity; no published per-second cap'
policies:
  - name: Local administrative API
    description: Solaris Zones APIs are administrative interfaces consumed locally on the Solaris host
      (or via authenticated RAD-over-HTTPS to the host). Rate is gated by host resource availability and
      SMF service responsiveness rather than by a centralized API-management quota.
  - name: Authentication and authorization
    description: Access is gated by Solaris user accounts, role-based access control (RBAC), and TLS-authenticated
      RAD client connections; this implicitly limits abusive call rates.
